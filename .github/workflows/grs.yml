
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate green snake
        uses: Platane/snk@v3
        with:
          github_user_name: sarathTechie
          outputs: |
            github-contribution-grid-snake.svg?palette=github-dark&color_snake=#39d353

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg
          git commit -m "Update green contribution snake" || exit 0
          git push
